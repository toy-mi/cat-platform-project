spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cat_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: xxxx      # 你的MySQL密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis配置（无Redis可不配，不影响基础功能）
  redis:
    host: localhost
    port: 6379
    password:# 有密码则填写，无密码留空
    timeout: 5000ms

  # 日期格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml  # 如果使用XML，可保留；使用BaseMapper则无需XML
  type-aliases-package: org.example.catplatform.module.*.entity
  global-config:
    db-config:
      id-type: auto                           # 自增主键
      logic-delete-field: deleted              # 逻辑删除字段（如果表中有）
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true         # 驼峰命名自动转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志，开发时开启

server:
  port: 8080

# JWT认证配置，务必替换secret为自定义随机字符串
jwt:
  secret: your-256-bit-secret-your-256-bit-secret  # 至少32个字符，建议用随机字符串
  expiration: 86400000  # 24小时，单位毫秒

# 文件上传配置
file:
  upload:
    base: ./uploads/
#    base: 你电脑上的uploads文件地址         #可选，可以把文件转移到那
    path: ${file.upload.base}/cats       
    community: ${file.upload.base}/community
    avatar: ${file.upload.base}/avatars
    task: ${file.upload.base}/tasks
    donation: ${file.upload.base}/donations
    agreements: ${file.upload.base}/agreements
  access:
    prefix: /uploads/cats/   # 猫咪照片的URL 访问前缀

